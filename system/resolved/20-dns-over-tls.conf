# Install to /etc/systemd/resolved.conf.d/
# Send all lookups (except Tailscale's ts.net split DNS) to Quad9 over TLS instead of
# the router/ISP in plaintext. "opportunistic" falls back to plain DNS if port 853 is
# blocked (captive portals), so Wi-Fi logins keep working.
# Caveat: hostnames that only exist on a local network's DNS (e.g. uni intranet names)
# won't resolve. Remove this file and `systemctl restart systemd-resolved` to revert.
[Resolve]
DNS=9.9.9.9#dns.quad9.net 149.112.112.112#dns.quad9.net 2620:fe::fe#dns.quad9.net 2620:fe::9#dns.quad9.net
FallbackDNS=1.1.1.1#cloudflare-dns.com 1.0.0.1#cloudflare-dns.com
Domains=~.
DNSOverTLS=opportunistic
