# Install to /etc/modprobe.d/
# Rarely used network protocols and FireWire. Any unprivileged program can auto-load
# these kernel modules just by opening a socket, and they've had local root CVEs
# (dccp, rds, tipc, sctp). This laptop has no FireWire port. Lynis NETW-3200 / STRG-1846.
# "install ... /bin/false" also blocks auto-loading, which "blacklist" alone doesn't.
# To undo: delete this file from /etc/modprobe.d/.
install dccp /bin/false
install sctp /bin/false
install rds /bin/false
install tipc /bin/false
install firewire-core /bin/false
install firewire-ohci /bin/false
install firewire-sbp2 /bin/false
