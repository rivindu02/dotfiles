#!/usr/bin/nft -f
# Host firewall: default-deny inbound, everything outbound allowed.
# Install: sudo install -Dm644 nftables.conf /etc/nftables.conf && sudo systemctl enable --now nftables
#
# Uses its own table instead of `flush ruleset`, which would wipe the rules
# Docker and tailscaled insert. No forward chain, so container networking
# and Tailscale routing are untouched.

destroy table inet host_firewall

table inet host_firewall {
    chain input {
        type filter hook input priority filter; policy drop;

        ct state established,related accept
        ct state invalid drop
        iifname "lo" accept

        # ICMP (IPv6 neighbour discovery breaks without these)
        ip protocol icmp accept
        ip6 nexthdr ipv6-icmp accept

        # DHCP replies
        udp sport 67 udp dport 68 accept
        ip6 saddr fe80::/10 udp sport 547 udp dport 546 accept

        # Tailscale: everything on the tailnet, plus WireGuard for direct peer paths
        iifname "tailscale0" accept
        udp dport 41641 accept

        # Containers talking to the host
        iifname { "docker0", "br-*", "podman*", "cni-podman*" } accept

        # mDNS (printers, .local discovery)
        udp dport 5353 accept

        # LocalSend (localsend-bin)
        tcp dport 53317 accept
        udp dport 53317 accept

        # Uncomment if you enable sshd and want it reachable outside Tailscale
        # tcp dport 22 accept
    }
}
