# Kernel hardening for a single-user laptop. Install to /etc/sysctl.d/
# Hide kernel pointers from everyone (also root without CAP_SYSLOG)
kernel.kptr_restrict = 2
# No replacing the running kernel via kexec (not used; blocks a persistence trick)
kernel.kexec_load_disabled = 1
# JIT hardening for BPF
net.core.bpf_jit_harden = 2
# Don't autoload obscure TTY line disciplines (history of local root bugs)
dev.tty.ldisc_autoload = 0
# No setuid core dumps (core dumps are disabled anyway, see coredump.conf.d)
fs.suid_dumpable = 0

# Laptop is not a router: ignore/avoid ICMP redirects
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
# Reverse-path filtering in loose mode (strict mode breaks Tailscale)
net.ipv4.conf.all.rp_filter = 2
net.ipv4.conf.default.rp_filter = 2
# Protect against TIME-WAIT assassination
net.ipv4.tcp_rfc1337 = 1
