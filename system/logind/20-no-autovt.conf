# Do not start a getty when a VT with no session becomes active.
# At logout Hyprland's VT (tty2) became active for a moment, logind started
# getty@tty2, and the next sddm login on tty2 failed with
# "Failed to take control of /dev/tty2: Operation not permitted" (session ended at once).
# ReserveVT=6 keeps a getty on tty6 for emergencies (Ctrl+Alt+F6).
[Login]
NAutoVTs=0
