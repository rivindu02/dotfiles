# Stop the user manager right after the last session ends.
# With the default 10 s delay, a quick re-login reuses the old manager, PAM returns
# at once and sddm switches VT while the X11 greeter is still exiting. The switch
# hangs, sddm reports "Session started false" after 30 s and kills the session.
[Login]
UserStopDelaySec=0
