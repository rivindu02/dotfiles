# Install to /etc/NetworkManager/conf.d/
# Random MAC while scanning; per-network "stable" random MAC when connected, so
# networks can't track the laptop across locations but captive portals and the
# home router still see the same address every time.
[device]
wifi.scan-rand-mac-address=yes

[connection]
wifi.cloned-mac-address=stable
ethernet.cloned-mac-address=stable
