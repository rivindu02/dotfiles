# Shared by systemd user services and apply-desktop-theme.sh.
GTK_THEME=Gruvbox-Material-Dark
# GTK 4.24 blur compatibility: use compositor blur instead of the new protocol.
# https://github.com/hyprwm/Hyprland/discussions/16507
GDK_WAYLAND_DISABLE=ext_background_effect_manager_v1
XCURSOR_THEME=Bibata-Modern-Classic
XCURSOR_SIZE=24
HYPRCURSOR_SIZE=24
QT_QPA_PLATFORMTHEME=gtk3
QT_QPA_PLATFORM=wayland
QT_WAYLAND_DISABLE_WINDOWDECORATION=1
QT_SCALE_FACTOR_ROUNDING_POLICY=PassThrough
ELECTRON_OZONE_PLATFORM_HINT=wayland
