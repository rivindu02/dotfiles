# Menus: playlist and file browser are separate even with one file loaded.
p       script-binding uosc/playlist
o       script-binding uosc/open-file
c       script-binding uosc/chapters
F1      script-binding uosc/menu
?       script-binding shortcut_help/toggle
w       script-binding select/select-watch-later

# Next / previous file; p stays reserved for the playlist.
n       script-binding uosc/next
P       script-binding uosc/prev

# Volume (also support VLC's Ctrl+Up/Down).
UP      add volume 5
DOWN    add volume -5
Ctrl+UP   add volume 5
Ctrl+DOWN add volume -5
m       cycle mute

# Seek: plain arrows 5s; VLC modifiers 3s / 10s / 60s / 5min.
LEFT             seek -5 exact
RIGHT            seek 5 exact
Shift+LEFT       seek -3 exact
Shift+RIGHT      seek 3 exact
Alt+LEFT         seek -10 exact
Alt+RIGHT        seek 10 exact
Ctrl+LEFT        seek -60 exact
Ctrl+RIGHT       seek 60 exact
Ctrl+Alt+LEFT    seek -300 exact
Ctrl+Alt+RIGHT   seek 300 exact

# VLC-style speed controls; Backspace also resets speed by default.
[       add speed -0.1
]       add speed 0.1
+       multiply speed 1.5
-       multiply speed 0.6666666667
=       set speed 1

# Familiar playback, frame, track, timing, screenshot, and quit controls.
SPACE   cycle pause
f       cycle fullscreen
ESC     set fullscreen no
t       show-progress
e       frame-step
b       cycle audio
v       cycle sub
# Timing adjustments moved off Vim navigation keys.
Alt+k   add audio-delay 0.05
Alt+j   add audio-delay -0.05
(       add sub-delay -0.05
)       add sub-delay 0.05
Ctrl+q  quit

# Vim-style playback navigation (menus retain their arrow keys).
h       seek -5 exact
l       seek 5 exact
j       add volume -5
k       add volume 5
H       seek -60 exact
L       seek 60 exact
g-g     seek 0 absolute exact
0       seek 0 absolute exact
G       seek 100 absolute-percent exact
Ctrl+d  seek 30 exact
Ctrl+u  seek -30 exact
u       revert-seek
Ctrl+l  ab-loop

# Explicitly retain useful controls; built-in defaults are disabled.
BS      set speed 1
q       quit
s       screenshot
Ctrl+s  screenshot window
Shift+BS revert-seek
PGUP    add chapter 1
PGDWN   add chapter -1
i       script-binding stats/display-stats
I       script-binding stats/display-stats-toggle

# Mouse and media controls.
MBTN_LEFT_DBL cycle fullscreen
WHEEL_UP     add volume 5
WHEEL_DOWN   add volume -5
PLAYPAUSE    cycle pause
PLAY         set pause no
PAUSE        set pause yes
PLAYONLY     set pause no
PAUSEONLY    set pause yes
NEXT         script-binding uosc/next
PREV         script-binding uosc/prev
VOLUME_UP    add volume 5
VOLUME_DOWN  add volume -5
MUTE         cycle mute
CLOSE_WIN    quit
