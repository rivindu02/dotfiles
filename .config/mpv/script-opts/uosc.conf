# Local overrides; other options use uosc defaults.
# The font is inherited from osd-font in mpv.conf.
timeline_size=32

# Playback, tracks, chapters, speed, repeat current file, and file navigation.
controls=menu,gap,play-pause,<video,audio>subtitles,<has_many_audio>audio,<has_many_video>video,<has_many_edition>editions,<has_chapter>chapters,<stream>stream-quality,gap,space,<video,audio>speed,space,loop-file,gap,prev,items,next,gap,fullscreen

# Allow menu shortcuts to toggle their menus; press / or Ctrl+f to search.
menu_type_to_search=no

# Preserve the existing Catppuccin colors and transparency.
color=foreground=cdd6f4,foreground_text=1e1e2e,background=1e1e2eaa,background_text=cdd6f4,curtain=11111b,success=89dceb,error=f38ba8
opacity=timeline=0.8,position=1,chapters=0.8,slider=0.9,slider_gauge=1,controls=0.6,speed=0.6,menu=0.7,submenu=0.5,border=1,title=1,tooltip=1,thumbnail=1,curtain=0.4,idle_indicator=0.8,audio_indicator=0.5,buffering_indicator=0.3,playlist_position=0.8,heatmap=0.4
