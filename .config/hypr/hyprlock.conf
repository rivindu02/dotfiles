# ╔══════════════════════════════════════════════════╗
# ║          hyprlock.conf — Gruvbox Dark            ║
# ║          rivindu02 · Arch Linux · Hyprland       ║
# ╚══════════════════════════════════════════════════╝
#
# Style: central frosted-glass card, username box,
#        transparent input — Gruvbox Dark palette
#
# Gruvbox:  bg0 #282828  fg1 #ebdbb2
#           orange #fe8019  yellow #fabd2f
#           red #cc241d  aqua #8ec07c

# ━━━ BACKGROUND ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

background {
    monitor =
    path = /home/rivindu02/Pictures/Wallpapers/wallhaven-rqg6m7.jpg
    blur_passes = 1
    blur_size = 4
    contrast = 0.89
    brightness = 0.85
    vibrancy = 0.20
    vibrancy_darkness = 0.0
}

# ━━━ GENERAL ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

general {
    no_fade_in = false
    grace = 0
    disable_loading_bar = false
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# MAIN CARD — rendered first (behind everything)
# Gruvbox bg0 frosted glass panel
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

shape {
    monitor =
    size = 480, 520
    color = rgba(40, 40, 40, 0.78)
    rounding = 28
    border_size = 1
    border_color = rgba(254, 128, 25, 0.25)
    rotate = 0
    xray = false
    position = 0, -70
    halign = center
    valign = center
}

# ━━━ AVATAR ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Place image at ~/.face.icon

image {
    monitor =
    path = ~/.face.icon
    border_size = 2
    border_color = rgba(254, 128, 25, 0.85)
    size = 100
    rounding = -1
    rotate = 0
    reload_time = -1
    position = 0, 170
    halign = center
    valign = center
}

# ━━━ USERNAME (above clock) ━━━━━━━━━━━━━━━━━━━━━━━

label {
    monitor =
    text = $USER
    color = rgba(235, 219, 178, 0.90)
    font_size = 18
    font_family = CaskaydiaMono Nerd Font Mono Bold
    position = 0, 82
    halign = center
    valign = center
}

# ━━━ CLOCK (12-hr) ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%I:%M")"
    color = rgba(250, 189, 47, 1.0)
    font_size = 62
    font_family = CaskaydiaMono Nerd Font Mono Bold
    position = 0, -18
    halign = center
    valign = center
}

# ━━━ DATE ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %B %d")"
    color = rgba(254, 128, 25, 0.90)
    font_size = 17
    font_family = CaskaydiaMono Nerd Font Mono
    position = 0, -90
    halign = center
    valign = center
}

# ━━━ USER BOX (frosted pill behind username+input) ━━

shape {
    monitor =
    size = 320, 52
    color = rgba(254, 128, 25, 0.10)
    rounding = -1
    border_size = 1
    border_color = rgba(254, 128, 25, 0.30)
    rotate = 0
    xray = false
    position = 0, -188
    halign = center
    valign = center
}

# ━━━ USER LABEL (inside user box) ━━━━━━━━━━━━━━━━━━

label {
    monitor =
    text =  $USER
    color = rgba(235, 219, 178, 0.80)
    font_size = 14
    font_family = CaskaydiaMono Nerd Font Mono
    position = 0, -188
    halign = center
    valign = center
}

# ━━━ PASSWORD INPUT ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

input-field {
    monitor =
    size = 320, 52
    outline_thickness = 0
    dots_size = 0.22
    dots_spacing = 0.20
    dots_center = true
    dots_rounding = -1

    outer_color = rgba(255, 255, 255, 0)
    inner_color = rgba(255, 255, 255, 0.08)
    font_color = rgba(235, 219, 178, 0.95)
    font_family = CaskaydiaMono Nerd Font Mono

    check_color = rgba(142, 192, 124, 0.80)
    fail_color = rgba(204, 36, 29, 0.80)
    fail_text = <i> Wrong password</i>
    fail_timeout = 2000
    fail_transition = 300

    capslock_color = rgba(215, 153, 33, 0.90)

    placeholder_text = <i><span foreground="##a89984cc">  Enter password</span></i>
    hide_input = false
    rounding = -1

    fade_on_empty = false

    position = 0, -268
    halign = center
    valign = center
}

