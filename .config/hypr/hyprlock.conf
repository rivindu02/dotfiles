# ╔══════════════════════════════════════════════════╗
# ║      hyprlock.conf — Gruvbox Material Dark       ║
# ║          rivindu02 · Arch Linux · Hyprland       ║
# ╚══════════════════════════════════════════════════╝
#
# Style: no card, typography-led. Thin oversized clock,
#        compact avatar + translucent input below, status row at bottom.
#
# Shared Rofi palette: foreground #ebdbb2, dim #928374, accent #83a598.
# State colours: yellow #d8a657, red #ea6962, orange #e78a4e.
#
# set-wallpaper.sh rewrites `path =` inside the background block,
# so keep that block at column 0 with a single path line.

# ━━━ BACKGROUND ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

background {
    monitor =
    path = /home/rivindu02/Pictures/Wallpapers/wallhaven-5y3e69.jpg
    color = rgba(29, 32, 33, 1.0)
    blur_passes = 3
    blur_size = 6
    contrast = 0.90
    brightness = 0.55
    vibrancy = 0.15
    vibrancy_darkness = 0.0
}

# ━━━ GENERAL ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

general {
    immediate_render = true
    hide_cursor = true
    fail_timeout = 2000
}

animations {
    enabled = true
    # Soft entrance with a quicker exit and restrained input feedback.
    bezier = softFade, 0.25, 0.1, 0.25, 1
    bezier = softInput, 0.22, 1, 0.36, 1
    animation = fadeIn, 1, 10, softFade
    animation = fadeOut, 1, 8, softFade
    animation = inputFieldColors, 1, 3, softInput
    animation = inputFieldDots, 1, 2, softInput
}

# ━━━ CLOCK ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

label {
    monitor =
    text = cmd[update:1000] echo "<span font_weight='200'>$(date +%H:%M)</span>"
    color = rgba(235, 219, 178, 1.0)
    font_size = 124
    font_family = Caskaydia Mono Nerd Font Propo
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.25)
    position = 0, 180
    halign = center
    valign = center
}

# ━━━ DATE ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

label {
    monitor =
    text = cmd[update:60000] echo "<span letter_spacing='4096'>$(date +'%A · %-d %B' | tr '[:lower:]' '[:upper:]')</span>"
    color = rgba(131, 165, 152, 1.0)
    font_size = 15
    font_family = Caskaydia Mono Nerd Font Propo SemiBold
    position = 0, 75
    halign = center
    valign = center
}

# ━━━ AVATAR ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

image {
    monitor =
    # square crop of ~/.face.icon (portrait photo rendered as an oval)
    path = ~/.face.lock.png
    size = 88
    rounding = -1
    border_size = 1
    border_color = rgba(131, 165, 152, 0.45)
    reload_time = -1
    position = 0, -25
    halign = center
    valign = center
}

# ━━━ USERNAME ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

label {
    monitor =
    text = $USER
    color = rgba(235, 219, 178, 1.0)
    font_size = 16
    font_family = Caskaydia Mono Nerd Font Propo SemiBold
    position = 0, -115
    halign = center
    valign = center
}

# ━━━ PASSWORD INPUT ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Borderless icon, password dots and error text in every state.

input-field {
    monitor =
    size = 104, 40
    outline_thickness = 0
    swap_font_color = true
    rounding = 12

    outer_color = rgba(0, 0, 0, 0)
    inner_color = rgba(0, 0, 0, 0)
    font_color = rgba(235, 219, 178, 1.0)
    font_family = Caskaydia Mono Nerd Font Propo
    check_color = rgba(216, 166, 87, 0.95)
    fail_color = rgba(234, 105, 98, 0.95)
    capslock_color = rgba(235, 219, 178, 1.0)
    numlock_color = rgba(235, 219, 178, 1.0)
    bothlock_color = rgba(235, 219, 178, 1.0)

    dots_size = 0.30
    dots_spacing = 0.25
    dots_center = true
    dots_rounding = -1

    placeholder_text = <span foreground="##a8aaa0" size="20pt">  </span>
    fail_text = <span foreground="##ea6962" size="14pt">Try again</span>
    fade_on_empty = false
    hide_input = false

    position = 0, -270
    halign = center
    valign = center
}

# ━━━ STATUS ROW (bottom) ━━━━━━━━━━━━━━━━━━━━━━━━━━━

label {
    monitor =
    text = cmd[update:30000] bat=/sys/class/power_supply/BAT0; cap=$(cat $bat/capacity); case $(cat $bat/status) in Charging) echo "󰂄  $cap%  charging";; Discharging) echo "$(echo 󰂎 󰁺 󰁻 󰁼 󰁽 󰁾 󰁿 󰂀 󰂁 󰂂 󰁹 | cut -d' ' -f$((cap / 10 + 1)))  $cap%";; *) echo "󰚥  $cap%  plugged in";; esac
    color = rgba(146, 131, 116, 1.0)
    font_size = 12
    font_family = Caskaydia Mono Nerd Font Propo
    position = 40, 30
    halign = left
    valign = bottom
}

label {
    monitor =
    text = 󰌌  $LAYOUT
    color = rgba(146, 131, 116, 1.0)
    font_size = 12
    font_family = Caskaydia Mono Nerd Font Propo
    position = 0, 30
    halign = center
    valign = bottom
}

label {
    monitor =
    text = cmd[update:60000] echo "󰍹  $(cat /etc/hostname) · up $(awk '{ s = int($1); printf "%dh %02dm", s / 3600, s % 3600 / 60 }' /proc/uptime)"
    color = rgba(146, 131, 116, 1.0)
    font_size = 12
    font_family = Caskaydia Mono Nerd Font Propo
    position = -40, 30
    halign = right
    valign = bottom
}
