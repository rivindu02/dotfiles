# ╔══════════════════════════════════════════════════╗
# ║      hyprlock.conf — Gruvbox Material Dark       ║
# ║          rivindu02 · Arch Linux · Hyprland       ║
# ╚══════════════════════════════════════════════════╝
#
# Style: no card, typography-led. Thin oversized clock,
#        avatar + pill input below, status row at bottom.
#
# Gruvbox Material:  bg #1d2021 #282828  surface #32302f
#                    fg #d4be98  dim #928374  blue #7daea3
#                    yellow #d8a657  red #ea6962  orange #e78a4e
#
# set-wallpaper.sh rewrites `path =` inside the background block,
# so keep that block at column 0 with a single path line.

# ━━━ BACKGROUND ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

background {
    monitor =
    path = /home/rivindu02/Pictures/Wallpapers/wallhaven-gw96l7.jpg
    color = rgba(29, 32, 33, 1.0)
    blur_passes = 3
    blur_size = 6
    contrast = 0.90
    brightness = 0.55
    vibrancy = 0.15
    vibrancy_darkness = 0.0
}

# ━━━ GENERAL ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

general {
    grace = 0
    immediate_render = true
    hide_cursor = true
}

animations {
    enabled = true
    bezier = easeOut, 0.16, 1, 0.3, 1
    animation = fadeIn, 1, 4, easeOut
    animation = fadeOut, 1, 4, easeOut
    animation = inputFieldColors, 1, 3, easeOut
    animation = inputFieldDots, 1, 2, easeOut
}

# ━━━ CLOCK ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

label {
    monitor =
    text = cmd[update:1000] echo "<span font_weight='200'>$(date +%H:%M)</span>"
    color = rgba(212, 190, 152, 1.0)
    font_size = 140
    font_family = CaskaydiaMono Nerd Font
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.45)
    position = 0, 190
    halign = center
    valign = center
}

# ━━━ DATE ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

label {
    monitor =
    text = cmd[update:60000] echo "<span letter_spacing='4096'>$(date +'%A · %d %B' | tr '[:lower:]' '[:upper:]')</span>"
    color = rgba(125, 174, 163, 1.0)
    font_size = 15
    font_family = CaskaydiaMono Nerd Font SemiBold
    position = 0, 75
    halign = center
    valign = center
}

# ━━━ AVATAR ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

image {
    monitor =
    # square crop of ~/.face.icon (portrait photo rendered as an oval)
    path = ~/.face.lock.png
    size = 96
    rounding = -1
    border_size = 2
    border_color = rgba(125, 174, 163, 1.0)
    reload_time = -1
    position = 0, -50
    halign = center
    valign = center
}

# ━━━ USERNAME ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

label {
    monitor =
    text = $USER
    color = rgba(212, 190, 152, 1.0)
    font_size = 15
    font_family = CaskaydiaMono Nerd Font SemiBold
    position = 0, -140
    halign = center
    valign = center
}

# ━━━ PASSWORD INPUT ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Outline colour shows state: blue idle, yellow checking,
# red wrong password, orange caps lock.

input-field {
    monitor =
    size = 320, 48
    outline_thickness = 2
    rounding = -1

    outer_color = rgba(125, 174, 163, 0.85)
    inner_color = rgba(50, 48, 47, 0.55)
    font_color = rgba(212, 190, 152, 1.0)
    font_family = CaskaydiaMono Nerd Font
    check_color = rgba(216, 166, 87, 0.95)
    fail_color = rgba(234, 105, 98, 0.95)
    capslock_color = rgba(231, 138, 78, 0.95)

    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    dots_rounding = -1

    placeholder_text = <span foreground="##928374">  Password</span>
    fail_text = <span foreground="##ea6962">  $FAIL ($ATTEMPTS)</span>
    fail_timeout = 2000
    fade_on_empty = false
    hide_input = false

    position = 0, -210
    halign = center
    valign = center
}

# ━━━ STATUS ROW (bottom) ━━━━━━━━━━━━━━━━━━━━━━━━━━━

label {
    monitor =
    text = cmd[update:30000] echo "󰁹  $(cat /sys/class/power_supply/BAT0/capacity)%  $(cat /sys/class/power_supply/BAT0/status)"
    color = rgba(146, 131, 116, 1.0)
    font_size = 12
    font_family = CaskaydiaMono Nerd Font
    position = 40, 30
    halign = left
    valign = bottom
}

label {
    monitor =
    text = 󰌌  $LAYOUT
    color = rgba(146, 131, 116, 1.0)
    font_size = 12
    font_family = CaskaydiaMono Nerd Font
    position = 0, 30
    halign = center
    valign = bottom
}

label {
    monitor =
    text = cmd[update:60000] echo "󰍹  $(cat /etc/hostname) · $(uptime -p | sed 's/^up //')"
    color = rgba(146, 131, 116, 1.0)
    font_size = 12
    font_family = CaskaydiaMono Nerd Font
    position = -40, 30
    halign = right
    valign = bottom
}
