# ~/.config/hypr/hypridle.conf
general {
    # A separate unit serializes lock requests and survives idle-daemon restarts.
    lock_cmd = systemctl --user start hyprlock.service
    before_sleep_cmd = loginctl lock-session
    # Wait for the compositor's locked notification before allowing suspend.
    inhibit_sleep = 3
    after_sleep_cmd = wlopm --on '*' && brightnessctl -rd asus::kbd_backlight
    ignore_dbus_inhibit = false
}

# 2 min → dim keyboard backlight only
listener {
    timeout = 120
    on-timeout = brightnessctl -sd asus::kbd_backlight set 0
    on-resume = brightnessctl -rd asus::kbd_backlight
}

# 2.5 min → lock screen (separate from dim, non-blocking)
listener {
    timeout = 150
    on-timeout = loginctl lock-session
}

# 5 min → monitor off
listener {
    timeout = 300
    on-timeout = wlopm --off '*'
    on-resume = wlopm --on '*' && brightnessctl -rd asus::kbd_backlight
}

# 20 min → suspend
listener {
    timeout = 1200
    on-timeout = systemctl suspend
}
# /etc/systemd/system/auto-suspend.timer --> 30min
# /etc/systemd/system/auto-suspend.service
