general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = pidof hyprlock || hyprlock
	after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms(true)' && brightnessctl -rd asus::kbd_backlight
}

# 2 minutes → lock screen 120
listener {
    timeout = 120
    on-timeout = pidof hyprlock || hyprlock
}

# 5 minutes → turn monitor off 300
listener {
    timeout = 300
    on-timeout = hyprctl dispatch 'hl.dsp.dpms(false)' && brightnessctl -sd asus::kbd_backlight set 0
    on-resume = hyprctl dispatch 'hl.dsp.dpms(true)' && brightnessctl -rd asus::kbd_backlight
}

# 20 minutes → suspend system
listener {
    timeout = 1200
    on-timeout = systemctl suspend
}
# /etc/systemd/system/auto-suspend.timer --> 30min
# /etc/systemd/system/auto-suspend.service
