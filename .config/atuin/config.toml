# atuin config: only settings that differ from the defaults.
# Full reference: `atuin default-config`.

update_check = false      # pacman updates it
auto_sync = false         # local only; no atuin account
style = "compact"
inline_height = 20        # open under the prompt instead of full screen
show_preview = true
enter_accept = false      # Enter puts the command on the prompt to edit; it does not run it
secrets_filter = true     # drop lines that look like API keys or tokens
workspaces = true         # "workspace" filter: whole git repo, subfolders included

# Never record commands that start with a space, or that set a key inline
history_filter = [
  "^ ",
  "(?i)(api[_-]?key|token|secret|password)=",
]

[search]
# Ctrl+R cycle order. "host" left out: sync is off, so it equals "global".
filters = ["global", "session", "directory", "workspace", "session-preload"]
