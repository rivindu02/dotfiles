[[mgr.prepend_keymap]]
on = ["R"]
run = "rename --empty=all"
desc = "Bulk rename"

# g = goto. Built-in: gg top, gh ~, gc ~/.config, gd ~/Downloads, g<Space> type a path,
# gt trash bin (O on an item: restore or empty, with a confirm dialog)
[[mgr.prepend_keymap]]
on = ["g", "."]
run = "cd ~/dotfiles"
desc = "Go to dotfiles"

[[mgr.prepend_keymap]]
on = ["g", "D"]
run = "cd ~/Documents"
desc = "Go to Documents"

[[mgr.prepend_keymap]]
on = ["g", "T"]
run = "cd /tmp"
desc = "Go to /tmp"

[[mgr.prepend_keymap]]
on = ["g", "r"]
run = "cd /"
desc = "Go to root"

[[mgr.prepend_keymap]]
on = ["g", "m"]
run = "cd /run/media/rivindu02"
desc = "Go to mounted drives"

[[mgr.prepend_keymap]]
on = ["g", "l", "s"]
run = "cd ~/.local/share"
desc = "Go to ~/.local/share"

[[mgr.prepend_keymap]]
on = ["g", "l", "b"]
run = "cd ~/.local/bin"
desc = "Go to ~/.local/bin"

[[mgr.prepend_keymap]]
on = ["g", "l", "t"]
run = "cd ~/.local/state"
desc = "Go to ~/.local/state"

[[mgr.prepend_keymap]]
on = ["g", "E"]
run = "plugin empty-trash"
desc = "Empty trash (asks first)"

[[mgr.prepend_keymap]]
on = "M"
run = "plugin mount"
desc = "Mount manager"

[[mgr.prepend_keymap]]
on = "y"
run = [ 'shell -- for path in %s; do echo "file://$path"; done | wl-copy -t text/uri-list' , "yank" ]

[[mgr.prepend_keymap]]
on = "Y"
run = 'shell -- wl-copy -t "$(file --mime-type -b %h)" < %h'
desc = "Copy file content to clipboard"

# e = edit: images open in satty (img-edit, saves back to the file), anything else in nvim
[[mgr.prepend_keymap]]
on = "e"
run = 'shell --block -- case "$(file --mime-type -b %h)" in image/*) setsid -f ~/.local/bin/img-edit %h >/dev/null 2>&1 ;; *) nvim %h ;; esac'
desc = "Edit (satty for images, nvim otherwise)"
