[opener]
edit = [
  { run = 'nvim %s', block = true, desc = "nvim", for = "unix" },
]
browser = [
  { run = '"$HOME/.local/bin/default-browser" -- %s', orphan = true, desc = "Default browser", for = "unix" },
]

[open]
# Web files open in the selected browser; `o` still offers nvim.
prepend_rules = [
  { mime = "text/html", use = [ "browser", "edit", "reveal" ] },
  { mime = "application/xhtml+xml", use = [ "browser", "edit", "reveal" ] },
  { url = "*.{html,htm,xhtml,mhtml,mht,shtml}", use = [ "browser", "edit", "reveal" ] },
  { url = "*.{url,webloc,desktop.url}", use = [ "browser", "edit" ] },
]

[mgr]
linemode = "size"
