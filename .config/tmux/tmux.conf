# Leader key
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# True color
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",ghostty:RGB"

# Start windows and panes at 1
set -g base-index 1
setw -g pane-base-index 1

# Mouse support
set -g mouse on
set -g set-clipboard external

# Increase scrollback
set -g history-limit 1000

# split panes using | and -, make sure they open in the same path
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# open new windows in the current path
bind c new-window -c "#{pane_current_path}"

# switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# shorten command delay
set -sg escape-time 1

# don't rename windows automatically
set -g allow-rename off

# allow focus events to get through to applications running in tmux
set -g focus-events on

# Use vi keys in copy mode
setw -g mode-keys vi

# Wayland clipboard integration (wl-clipboard)
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy"

# Design Tweaks (Gruvbox Material Match)

# loud or quiet?
set -g visual-activity on
set -g visual-bell on
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# Copy-mode Selection / Highlight
setw -g clock-mode-colour "#d8a657"            # Gruvbox Yellow
setw -g mode-style "fg=#dfd0b8,bg=#504945 bold" # Subtle Charcoal Highlight

# Window splitting borders
set -g pane-border-style "fg=#504945"           # Muted boundary line
set -g pane-active-border-style "fg=#a9b665"    # Forest Green for active pane

# Statusbar base configuration
set -g status-position bottom
set -g status-justify left
set -g status-style "fg=#ea6962"                # Muted Coral Accent base

set -g status-left '#{?client_prefix,#[fg=#a9b665],#[fg=#ea6962]} '
set -g status-right-length 50


set -g status-right-style 'fg=#282828 bg=#d8a657'
# Refresh status line every 2 seconds
set -g status-interval 2

# Fixed dynamic SSH Indicator inside your pill theme (Updated Hex Colors)
set -g status-right '#(proc=$(ps -t "#{pane_tty}" -o comm= 2>/dev/null | tail -n 1); if [ "$proc" = "ssh" ]; then host=$(ps -t "#{pane_tty}" -o args= 2>/dev/null | tail -n 1 | awk "{print \$NF}"); echo "#[bg=terminal fg=#d3869b]#[bg=#d3869b fg=#282828] 🌐 $host #[bg=terminal fg=#d3869b]"; else echo "#[bg=terminal fg=#d8a657]#[bg=#d8a657 fg=#282828] #H #[bg=terminal fg=#d8a657]"; fi)'

# Active Window Status Tab (Uses low-contrast Blue/Aqua scheme)
setw -g window-status-current-style 'fg=#282828 bg=#ea6962 bold'
setw -g window-status-current-format '#[bg=terminal fg=#7daea3]#[bg=#7daea3 fg=#282828]#I #W #F#[bg=terminal fg=#7daea3]#[bg=#ea6962 fg=#282828]'

# Inactive Window Status Tabs
setw -g window-status-style 'fg=#7daea3'
setw -g window-status-separator ''
setw -g window-status-format ' #I #[fg=#dfd0b8]#W #[fg=#d8a657]#F '

setw -g window-status-bell-style 'fg=#d8a657 bg=#ea6962 bold'

# Command messages prompt line
set -g message-style 'fg=#d8a657 bg=terminal bold'

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Session Resurrecting
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Automatic restore on tmux server start
set -g @continuum-restore 'on'

run '~/.tmux/plugins/tpm/tpm'

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"
